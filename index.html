<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#90333c">
  <meta name="description" content="Gerllayne Silva: estudante de Psicologia, apaixonada por livros. Minha rotina, estudos, leituras e jornada.">
  <title>Gerllayne Silva — Minha jornada</title>
  <link rel="preload" href="assets/sacramento.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section class="apresentacao" aria-labelledby="nome">
      <div class="apresentacao-conteudo">
        <p class="saudacao">Oie, eu sou a</p>
        <img class="estrelas estrelas-esquerda" src="assets/estrelas.png" alt="" width="149" height="149">
        <div class="retrato-e-nome">
          <div class="retrato">
            <img class="foto" src="assets/gerllayne.jpg" alt="Gerllayne Silva sorrindo com um buquê de flores" width="960" height="1280" fetchpriority="high">
          </div>
          <h1 id="nome">Gerllayne Silva</h1>
        </div>
        <img class="estrelas estrelas-direita" src="assets/estrelas.png" alt="" width="149" height="149">
      </div>
    </section>
    <div class="faixa-estrelada" aria-hidden="true"></div>
    <section class="sobre" aria-label="Um pouquinho sobre mim">
      <div class="cartao">
        <div class="cartao-interior">
          <img class="coracao-cartao" src="assets/coracao-vermelho.png" alt="" width="77" height="93">
          <p data-escrever>Sou estudante de Psicologia e apaixonada por livros. Por aqui compartilho um pouquinho da minha rotina, estudos, leituras e tudo aquilo que faz parte da minha jornada.</p>
        </div>
      </div>
    </section>
  </main>
  <footer class="rodape" aria-labelledby="titulo-redes">
    <span class="brilho-rodape brilho-esquerda" aria-hidden="true">✦</span>
    <div class="titulo-redes">
      <span class="coracao-creme" aria-hidden="true">♥</span>
      <h2 id="titulo-redes">Minhas redes</h2>
      <span class="coracao-creme" aria-hidden="true">♥</span>
    </div>
    <!-- Substitua cada span.rede por <a class="rede" href="URL_DO_PERFIL">...</a> ao adicionar os links. -->
    <ul class="redes" aria-label="Redes sociais">
      <li><span class="rede" title="Instagram — perfil em breve"><img src="assets/instagram.png" alt="Instagram — perfil em breve" width="29" height="29"></span></li>
      <li><a class="rede" href="https://www.tiktok.com/@gerllayne03?_r=1&amp;_t=ZS-9A4QbLU0Ufl" aria-label="Perfil de Gerllayne no TikTok" title="Perfil de Gerllayne no TikTok"><img src="assets/tiktok.png" alt="" width="29" height="28"></a></li>
      <li><a class="rede" href="https://youtube.com/@gerllayne03?si=VotSgLWJZ828M5b6" aria-label="Canal de Gerllayne no YouTube" title="Canal de Gerllayne no YouTube"><img src="assets/youtube.png" alt="" width="30" height="20"></a></li>
    </ul>
    <span class="brilho-rodape brilho-direita" aria-hidden="true">✦</span>
  </footer>
</body>
</html>
